function login(){let e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('pass').value.trim();if(e==='owner@protein.studio'&&p==='1234')S.role='owner';else if(e==='curator@protein.studio'&&p==='1234')S.role='curator';else if(e==='client@protein.studio'&&p==='1234')S.role='client';else if(!e||!p){toast('Заполни логин и пароль');return}else S.role='client';S.email=e;save();boot()}function register(){let n=prompt('Как тебя зовут?','Новый участник');if(!n)return;S.name=n;S.role='client';S.day=1;S.stars=0;S.startDate=new Date().toISOString();save();boot();toast('Добро пожаловать 🌿')}function boot(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');show('home')}
function show(t){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));({home,topics,chat,stars,profile,admin,appointments,marathon,topic}[t]||home)();scrollTo(0,0)}
function home(){let p=Math.round(Math.min(S.day,10)*10),t=T[S.day-1];document.getElementById('content').innerHTML=`<div class="hero"><div class="eyebrow">День ${S.day} из 10 · Марафон №${S.marathon}</div><h1>Привет, ${S.name}! 🌿</h1><p>Маленькие шаги каждый день ведут к большим результатам.</p><button class="btn primary" onclick="show('topic')">Перейти к теме дня →</button></div><div class="grid4"><button class="quick" onclick="show('marathon')"><div class="ico">🗓️</div><small>Мой марафон</small></button><button class="quick" onclick="show('topics')"><div class="ico">🥗</div><small>Питание</small></button><button class="quick" onclick="water()"><div class="ico">💧</div><small>Вода</small></button><button class="quick" onclick="steps()"><div class="ico">👣</div><small>Шаги</small></button></div><div class="card"><div class="row"><div><div class="muted">Мой прогресс</div><div class="title">День ${S.day}/10</div></div><div class="daycircle" style="--p:${p*3.6}deg"><span>${p}%</span></div></div><div class="progress"><i style="width:${p}%"></i></div><p class="muted">Сегодня: <b>${t[0]}</b></p></div><div class="card"><div class="row"><div><div class="muted">Сегодня</div><div class="title">${t[0]}</div></div><span class="pill">⭐ +1</span></div><p>${t[1]}</p><button class="btn primary" style="width:100%" onclick="show('topic')">Открыть тему</button></div><div class="card"><div class="row"><b>Ваши показатели</b><span class="stars">★ ${S.stars}</span></div><div class="row" style="margin-top:12px"><span>⚖️ ${S.weight} кг</span><span>💧 ${S.water}/6</span><span>👣 ${S.steps}</span></div></div><div class="card"><div class="row"><div><b>Wellness-встреча</b><div class="muted">Оценка • сканирование • консультация</div></div><button class="smallbtn" onclick="show('appointments')">Записаться</button></div></div>${S.role!=='client'?`<button class="btn light" style="width:100%" onclick="show('admin')">👑 Открыть ${S.role==='owner'?'панель владельца':'кабинет куратора'}</button>`:''}`}
function topic(){let t=T[Math.min(S.day-1,29)],done=S.completed[S.day];document.getElementById('content').innerHTML=`<button class="smallbtn" onclick="show('home')">← Назад</button><div class="card"><span class="pill">ДЕНЬ ${S.day} · ТЕМА</span><h1>${t[0]}</h1><img class="topic-img" src="${img(t[3])}"><p style="font-size:16px;line-height:1.6">${t[1]}</p><div class="tip"><b>💡 Лайфхак дня</b><br>${t[4]}</div><div class="try"><b>🌱 Попробуй сегодня</b><div class="check"><input type="checkbox"> Выполнить небольшое действие</div><div class="check"><input type="checkbox"> Отметить, что получилось</div></div><button class="btn primary" style="width:100%" onclick="complete()">${done?'✓ Тема отмечена':'⭐ Я прошла тему  (+1 звезда)'}</button></div>`}
function complete(){if(S.completed[S.day])return;if(S.day>=10){S.completed[S.day]=1;S.stars++;save();marathon();return}S.completed[S.day]=1;S.stars++;S.day++;save();toast('Готово! ⭐ +1. Следующая тема открыта.');home()}
function marathon(){let n=Object.keys(S.completed).length;document.getElementById('content').innerHTML=`<div class="card"><span class="pill">МАРАФОН №${S.marathon}</span><h1>Твои 10 дней 🌿</h1><p class="muted">Старт: ${new Date(S.startDate).toLocaleDateString('ru-RU')}</p><div class="progress"><i style="width:${Math.min(n,10)*10}%"></i></div><p><b>${Math.min(n,10)}/10</b> тем завершено</p><button class="btn primary" style="width:100%" onclick="show('topic')">Продолжить</button>${n>=10?`<button class="btn light" style="width:100%;margin-top:8px" onclick="nextMarathon()">Следующий марафон →</button>`:''}</div><div class="card"><b>Персональный старт</b><p class="muted">Каждый участник начинает свои 10 дней со своей даты и не ждёт календарного старта.</p></div>`}function nextMarathon(){S.marathon++;S.day=1;S.completed={};S.startDate=new Date().toISOString();S.stars+=3;save();toast('Новый марафон начался! ⭐ +3');home()}
function topics(){let html='<div class="title">Библиотека 30 тем</div><p class="muted">Текущая тема отмечена зелёным.</p>';T.forEach((t,i)=>{let action=i+1<=S.day?'openT('+i+')':"toast('Тема откроется по плану марафона')";html+=`<button class="card" style="width:100%;text-align:left" onclick="${action}"><div class="row"><span class="pill">ДЕНЬ ${i+1}</span><span>${i+1<=S.day?'✓':'›'}</span></div><b style="display:block;margin-top:8px">${t[2]} ${t[0]}</b><small class="muted">${t[1]}</small></button>`});document.getElementById('content').innerHTML=html}
function openT(i){let t=T[i];document.getElementById('content').innerHTML=`<button class="smallbtn" onclick="show('topics')">← Темы</button><div class="card"><span class="pill">ТЕМА ${i+1}</span><h1>${t[0]}</h1><img class="topic-img" src="${img(t[3])}"><p style="line-height:1.6">${t[1]}</p><div class="tip"><b>💡 Лайфхак</b><br>${t[4]}</div><div class="try"><b>🌱 Попробуй сегодня</b><br>${t[5]}</div></div>`}
function stars(){let R=[['🥤','Клубный коктейль',15],['🍫','Протеиновый батончик',25],['🍵','Чай / полезный набор',40],['🎁','Подарочный продукт',60],['🌿','Клубные дни',80]];document.getElementById('content').innerHTML=`<div class="hero"><div class="eyebrow">МОИ ЗВЁЗДЫ</div><div class="stars">★ ${S.stars}</div><p>Звёзды — внутренняя система мотивации. Сейчас они не являются деньгами.</p></div><div class="card"><b>Как получить ⭐</b><p class="muted">Тема дня · вес · вода · шаги · посещение клуба · Wellness-встреча · события.</p></div><div class="title">Награды</div>`+R.map(r=>`<div class="card reward"><div class="rpic">${r[0]}</div><div style="flex:1"><b>${r[1]}</b><div class="muted">${r[2]} ⭐</div></div><button class="smallbtn" onclick="claim(${r[2]})">${S.stars>=r[2]?'Получить':'Ещё ⭐'}</button></div>`).join('')}
function claim(n){if(S.stars<n){toast('Пока не хватает звёзд');return}S.stars-=n;save();toast('Заявка на награду отправлена 🌿');stars()}
function chat(){document.getElementById('content').innerHTML=`<div class="title">Чат клуба</div><div class="tabs"><button class="on">Общий чат</button><button>Объявления</button><button>Мой куратор</button></div><div class="card"><div class="chat" id="chatbox">${S.chats.map(m=>`<div class="msg ${m.me?'me':''}"><b>${m.who}</b><br>${m.text}<small>сейчас</small></div>`).join('')}</div><div class="composer"><input id="chatin" placeholder="Написать сообщение…"><button class="btn primary" onclick="send()">➤</button></div></div><div class="card"><small class="muted">Демо-режим: сообщения сохраняются на этом устройстве. Для общего чата между телефонами подключается backend.</small></div>`}function send(){let x=document.getElementById('chatin').value.trim();if(!x)return;S.chats.push({who:S.name||'Я',text:x,me:true});save();chat()}
function profile(){document.getElementById('content').innerHTML=`<div class="card"><div class="row"><div><div class="muted">МОЙ ПРОФИЛЬ</div><h1>${S.name}</h1><span class="pill">${S.role==='owner'?'Владелец клуба':S.role==='curator'?'Куратор':'Участник'}</span></div><div style="font-size:40px">👩🏻</div></div></div><div class="card"><div class="row"><b>Мои показатели</b><button class="smallbtn" onclick="weight()">Добавить вес</button></div><div class="row" style="margin-top:15px"><span>Старт<br><b>${S.startWeight} кг</b></span><span>Сейчас<br><b>${S.weight} кг</b></span><span>Звёзды<br><b>⭐ ${S.stars}</b></span></div></div><div class="card"><div class="switch"><span>🔔 Уведомления</span><input type="checkbox" ${S.notifications?'checked':''} onchange="notif(this.checked)"></div><div class="switch"><span>💧 Напоминание о воде</span><input type="checkbox" checked></div><div class="switch"><span>⚖️ Напоминание о весе</span><input type="checkbox" checked></div></div><div class="card"><button class="btn light" style="width:100%" onclick="show('appointments')">📅 Wellness-встречи</button><button class="btn light" style="width:100%;margin-top:8px" onclick="logout()">Выйти</button></div>`}
function weight(){let w=parseFloat(prompt('Вес, кг',S.weight));if(!w)return;S.weight=w;S.stars++;save();toast('Вес сохранён · ⭐ +1');profile()}function water(){S.water=Math.min(6,S.water+1);if(S.water===1)S.stars++;save();toast('💧 Вода отмечена');home()}function steps(){let n=parseInt(prompt('Сколько шагов добавить?','1000'));if(!n)return;S.steps+=n;if(S.steps>=5000)S.stars++;save();toast('👣 Шаги сохранены');home()}async function notif(v){S.notifications=v;save();if(v&&'Notification'in window){let p=await Notification.requestPermission();toast(p==='granted'?'Уведомления разрешены':'Разрешение не выдано')}}
function appointments(){document.getElementById('content').innerHTML=`<div class="title">Wellness-встречи</div><div class="card"><b>Wellness-оценка</b><p class="muted">Оценка • сканирование • консультация</p><button class="btn primary" onclick="toast('Заявка отправлена куратору 🌿')">Записаться</button></div><div class="card"><b>Мой путь</b><div class="listitem">1️⃣ Новый контакт <span class="muted">регистрация</span></div><div class="listitem">2️⃣ Wellness-оценка <span class="muted">встреча</span></div><div class="listitem">3️⃣ Консультация <span class="muted">цель и план</span></div><div class="listitem">4️⃣ Марафон <span class="muted">поддержка</span></div></div>`}
function admin(){if(S.role==='client'){toast('Раздел доступен куратору или владельцу');return}let owner=S.role==='owner';document.getElementById('content').innerHTML=`<div class="row"><div><div class="eyebrow">${owner?'ПАНЕЛЬ ВЛАДЕЛЬЦА':'КАБИНЕТ КУРАТОРА'}</div><h1>${owner?'Protein Studio':'Мои участники'}</h1></div><button class="smallbtn" onclick="show('home')">←</button></div><div class="adminstat"><div class="stat"><b>${owner?S.users.length:4}</b>участников</div><div class="stat"><b>4</b>активных</div><div class="stat"><b>12</b>запросов</div><div class="stat"><b>5</b>встреч</div></div><div class="card"><b>Что сделать сегодня</b><div class="listitem">⚖️ <div style="flex:1"><b>Проверить вес</b><div class="muted">3 участника ещё не отметились</div></div>›</div><div class="listitem">⭐ <div style="flex:1"><b>Подтвердить действия</b><div class="muted">12 новых запросов</div></div>›</div><div class="listitem">📅 <div style="flex:1"><b>Wellness-встречи</b><div class="muted">5 записей</div></div>›</div></div><div class="card"><div class="row"><b>Участники</b><button class="smallbtn" onclick="addUser()">+ Добавить</button></div>${S.users.map(u=>`<div class="listitem"><div class="miniavatar">👤</div><div style="flex:1"><b>${u.name}</b><div class="muted">День ${u.day} · ⭐ ${u.stars} · ${u.status}</div></div><button class="smallbtn" onclick="toast('Открыта карточка ${u.name}')">Открыть</button></div>`).join('')}</div>${owner?'<div class="card"><b>Управление</b><div class="listitem">📚 <div style="flex:1"><b>30 тем</b><div class="muted">Выбор 10 тем для марафона</div></div><span>›</span></div><div class="listitem">👩‍💼 <div style="flex:1"><b>Кураторы</b><div class="muted">Роли и доступы</div></div><span>›</span></div><div class="listitem">📢 <div style="flex:1"><b>Объявления</b><div class="muted">Сообщение участникам</div></div><span>›</span></div></div>':''}<div class="card"><small class="muted">Версия 1.0: интерфейс и логика работают локально. Для реальной многопользовательской работы подключается backend/БД.</small></div>`}function addUser(){let n=prompt('Имя нового участника');if(!n)return;S.users.push({name:n,day:1,stars:0,status:'новый'});save();toast('Участник добавлен');admin()}function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
if(localStorage.getItem('ps_full_state'))boot();
</script></body></html>
